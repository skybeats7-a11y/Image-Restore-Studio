name: Build Intel standalone installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Restore prototype source
        run: |
          python3 - <<'PY'
          import base64, zlib, pathlib, py_compile
          p=pathlib.Path("src/app.py.zlib.b64")
          dst=pathlib.Path("src/app.py")
          dst.write_bytes(zlib.decompress(base64.b64decode(p.read_text().strip())))
          py_compile.compile(str(dst), doraise=True)
          print("Restored source",dst.stat().st_size)
          PY
      - name: Build and self-test Intel application
        run: bash scripts/build-mac.sh
      - name: Upload Intel installer
        uses: actions/upload-artifact@v4
        with:
          name: Image-Restore-Studio-Intel-0.4
          path: Image-Restore-Studio-*-Intel.pkg
          if-no-files-found: error
